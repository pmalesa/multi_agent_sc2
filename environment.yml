name: multi_agent_sc2_env
channels: 
  - pytorch
  - nvidia
  - defaults
  - conda-forge
dependencies:
  - python=3.12.0

  # Core packages
  - numpy=1.26.4
  - matplotlib=3.9.3

  # Deep learning framework
  - pytorch=2.5.1
  - pytorch-cuda=12.4
  - torchvision=0.20.1
  - torchaudio=2.5.1

  # Addtitional packages
  - pyyaml=6.0.2

  - pip
  - pip:
    - torchrl==0.6.0
    - tensordict==0.6.0
    - git+https://github.com/oxwhirl/smacv2.git 